{# One cabin seat. `cell` is a selectors.SeatCell. #}
<button
  type="button"
  data-seat="{{ cell.designation }}"
  {% if cell.is_taken %}
    disabled
    aria-label="Seat {{ cell.designation }}, taken"
    class="seat h-11 w-11 shrink-0 cursor-not-allowed rounded-lg border-2 border-slate-200 bg-slate-200 text-xs font-medium text-slate-400"
  {% else %}
    aria-label="Seat {{ cell.designation }}, available"
    aria-pressed="false"
    class="seat h-11 w-11 shrink-0 rounded-lg border-2 border-slate-300 bg-white text-xs font-medium text-slate-600 transition hover:border-sky-500 hover:bg-sky-100 hover:text-sky-800"
  {% endif %}
>{{ cell.designation }}</button>
