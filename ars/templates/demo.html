{% extends "base.html" %}

{% block title %}htmx demo{% endblock %}

{% block content %}
  <main class="mx-auto max-w-lg p-8 font-sans">
    <h1 class="text-2xl font-bold text-slate-800">htmx is wired up</h1>
    <button
      class="mt-4 rounded bg-sky-600 px-4 py-2 text-white hover:bg-sky-700"
      hx-post="{% url 'htmx-demo-ping' %}"
      hx-target="#result"
      hx-swap="innerHTML"
    >
      Ping the server
    </button>
    <div id="result" class="mt-4 text-slate-600"></div>
  </main>
{% endblock %}
