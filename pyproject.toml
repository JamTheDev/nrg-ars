[project]
name = "nrg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "django-htmx>=1.29",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.2",
    "sqlite-vec>=0.1.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import sorting, UP pyupgrade, B bugbear.
select = ["E", "F", "I", "UP", "B"]
